name: Restore main.gd and rebuild APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore main.gd from last good commit and apply syntax fix
        run: |
          set -euo pipefail
          git show d70cd06b2abae74b695a312ce07f6be11f315424:godot/scripts/main.gd > godot/scripts/main.gd
          python3 - <<'PY'
          from pathlib import Path
          p = Path("godot/scripts/main.gd")
          text = p.read_text()
          fixed = text.replace("_shockwave(player,CYAN,85\n", "_shockwave(player,CYAN,85)\n")
          if fixed == text:
              # already fixed or different layout — still accept if balanced
              if "_shockwave(player,CYAN,85\n" not in text:
                  print("Already fixed")
              else:
                  raise SystemExit("Broken pattern still present after replace")
          else:
              p.write_text(fixed)
              print("Syntax fix applied")
          print("Lines:", p.read_text().count(chr(10)) + 1)
          PY
          grep -n "CYAN,85" godot/scripts/main.gd

      - name: Commit restored file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add godot/scripts/main.gd
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "Restore main.gd from d70cd06 and fix missing parenthesis (APK crash)"
          git push
