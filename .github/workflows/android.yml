name: Build Neon Survivor Android APK

on:
  push:
    branches: [main]
    paths:
      - 'godot/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true
          packages: platform-tools platforms;android-35 build-tools;35.0.0 cmdline-tools;latest cmake;3.10.2.4988404 ndk;23.2.8568313

      - name: Install Godot 4.4.1 and export templates
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl -L --fail --retry 3 -o godot.zip "https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_linux.x86_64.zip"
          unzip -q godot.zip
          sudo install -m 0755 Godot_v4.4.1-stable_linux.x86_64 /usr/local/bin/godot
          curl -L --fail --retry 3 -o templates.tpz "https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_export_templates.tpz"
          mkdir -p "$HOME/.local/share/godot/export_templates/4.4.1.stable"
          mkdir -p "$RUNNER_TEMP/godot-templates"
          unzip -q templates.tpz -d "$RUNNER_TEMP/godot-templates"
          if [ -d "$RUNNER_TEMP/godot-templates/templates" ]; then
            cp -a "$RUNNER_TEMP/godot-templates/templates/." "$HOME/.local/share/godot/export_templates/4.4.1.stable/"
          else
            cp -a "$RUNNER_TEMP/godot-templates/." "$HOME/.local/share/godot/export_templates/4.4.1.stable/"
          fi
          godot --version

      - name: Configure Android export
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.config/godot" "$HOME/.android"
          keytool -genkeypair -noprompt -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          cat > "$HOME/.config/godot/editor_settings-4.4.tres" <<EOF
          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$HOME/.android/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF

      - name: Validate Godot project
        run: godot --headless --path godot --editor --quit

      - name: Export Android APK
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: ${{ github.workspace }}/.android/debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: |
          set -euo pipefail
          mkdir -p godot/build
          mkdir -p "$GITHUB_WORKSPACE/.android"
          cp "$HOME/.android/debug.keystore" "$GITHUB_WORKSPACE/.android/debug.keystore"
          godot --headless --path godot --export-debug "Android" godot/build/NeonSurvivor.apk --verbose 2>&1 | tee "$RUNNER_TEMP/godot-export.log"
          test -s godot/build/NeonSurvivor.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NeonSurvivor-Android-APK
          path: godot/build/NeonSurvivor.apk
          if-no-files-found: error
