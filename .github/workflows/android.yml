name: Build Signed Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['*.py','buildozer.spec','.github/workflows/**']
jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev
          python -m pip install --upgrade pip setuptools wheel
          pip install git+https://github.com/kivy/buildozer
          pip install legacy-cgi cython==0.29.34
      - name: Build release APK
        run: buildozer android release
      - name: Sign APK
        shell: bash
        run: |
          set -euo pipefail
          UNSIGNED_APK="$(find bin -maxdepth 1 -name '*unsigned.apk' -print -quit)"
          test -n "$UNSIGNED_APK"
          KEYSTORE="$RUNNER_TEMP/parvaz-release.keystore"
          STORE_PASS="temporary-build-key-2026"
          keytool -genkeypair -v \
            -keystore "$KEYSTORE" \
            -storepass "$STORE_PASS" \
            -keypass "$STORE_PASS" \
            -alias parvaz \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Parvaz Android Build,O=Parvaz,C=IR"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$APKSIGNER"
          SIGNED_APK="bin/parvaz-release-signed.apk"
          "$APKSIGNER" sign \
            --ks "$KEYSTORE" \
            --ks-key-alias parvaz \
            --ks-pass "pass:$STORE_PASS" \
            --key-pass "pass:$STORE_PASS" \
            --out "$SIGNED_APK" "$UNSIGNED_APK"
          "$APKSIGNER" verify --verbose --print-certs "$SIGNED_APK"
      - uses: actions/upload-artifact@v4
        with:
          name: parvaz-android-signed-apk
          path: bin/parvaz-release-signed.apk
          if-no-files-found: error
