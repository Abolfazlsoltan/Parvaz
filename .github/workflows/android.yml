name: Build Parvaz Android APK

on:
  push:
    branches: [main]
    paths:
      - 'godot/**'
      - '.github/workflows/android.yml'
      - 'README.md'
  pull_request:
    branches: [main]
    paths:
      - 'godot/**'
      - '.github/workflows/android.yml'
      - 'README.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true
          packages: platform-tools platforms;android-34 build-tools;34.0.0 cmdline-tools;latest cmake;3.10.2.4988404 ndk;23.2.8568313

      - name: Install Godot 4.4.1 and export templates
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl -fsSL --retry 3 -o godot.zip "https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_linux.x86_64.zip"
          unzip -q godot.zip
          sudo install -m 0755 Godot_v4.4.1-stable_linux.x86_64 /usr/local/bin/godot
          curl -fsSL --retry 3 -o templates.tpz "https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_export_templates.tpz"
          mkdir -p "$HOME/.local/share/godot/export_templates/4.4.1.stable"
          mkdir -p "$RUNNER_TEMP/godot-templates"
          unzip -q templates.tpz -d "$RUNNER_TEMP/godot-templates"
          if [ -d "$RUNNER_TEMP/godot-templates/templates" ]; then
            cp -a "$RUNNER_TEMP/godot-templates/templates/." "$HOME/.local/share/godot/export_templates/4.4.1.stable/"
          else
            cp -a "$RUNNER_TEMP/godot-templates/." "$HOME/.local/share/godot/export_templates/4.4.1.stable/"
          fi
          godot --version

      - name: Generate clean Android launcher icons
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet pillow
          python3 <<'PY'
          from pathlib import Path
          from PIL import Image, ImageDraw

          root = Path("godot")
          icon_dir = root / "icons"
          icon_dir.mkdir(parents=True, exist_ok=True)

          size = 512
          image = Image.new("RGBA", (size, size), (5, 12, 30, 255))
          draw = ImageDraw.Draw(image)
          cx = cy = size // 2

          for radius in range(232, 150, -4):
              alpha = max(4, int(42 * (radius - 150) / 82))
              draw.ellipse((cx-radius, cy-radius, cx+radius, cy+radius),
                           fill=(18, 115, 160, alpha))
          draw.ellipse((38, 38, 474, 474), fill=(8, 23, 48, 255),
                       outline=(55, 224, 255, 255), width=12)
          draw.ellipse((68, 68, 444, 444), outline=(26, 115, 160, 255), width=3)

          plane = [
              (256, 94), (283, 215), (393, 304), (386, 333),
              (280, 302), (270, 397), (316, 430), (310, 447),
              (256, 425), (202, 447), (196, 430), (242, 397),
              (232, 302), (126, 333), (119, 304), (229, 215)
          ]
          draw.polygon(plane, fill=(190, 244, 255, 255))
          draw.ellipse((242, 228, 270, 256), fill=(55, 224, 255, 255))
          draw.line((256, 108, 256, 193), fill=(255, 255, 255, 220), width=4)

          def save_icon(img, path, side):
              resized = img.resize((side, side), Image.Resampling.LANCZOS)
              path.parent.mkdir(parents=True, exist_ok=True)
              resized.save(path, "PNG", optimize=True)

          save_icon(image, root / "icon.png", 512)
          save_icon(image, icon_dir / "icon_192.png", 192)
          save_icon(image, icon_dir / "icon_adaptive_fg.png", 432)
          Image.new("RGBA", (432, 432), (8, 23, 48, 255)).save(
              icon_dir / "icon_adaptive_bg.png", "PNG", optimize=True
          )
          print("Generated all Godot Android icon resources.")
          PY
          test -s godot/icon.png
          test -s godot/icons/icon_192.png
          test -s godot/icons/icon_adaptive_fg.png
          test -s godot/icons/icon_adaptive_bg.png

      - name: Create ephemeral Android debug signing key
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.android" "$GITHUB_WORKSPACE/.android"
          keytool -genkeypair -noprompt \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass android -alias androiddebugkey -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"
          cp "$HOME/.android/debug.keystore" "$GITHUB_WORKSPACE/.android/debug.keystore"
          test -s "$HOME/.android/debug.keystore"

      - name: Import and validate Godot project
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path godot --editor --quit --verbose 2>&1 | tee "$RUNNER_TEMP/godot-editor.log"
          if grep -Eq 'SCRIPT ERROR:|Parse Error:|ERROR: Failed to load script|ERROR: Error importing' "$RUNNER_TEMP/godot-editor.log"; then
            echo "Godot editor validation reported a script or resource error."
            exit 1
          fi

      - name: Run headless game startup smoke test
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path godot --quit-after 12 --verbose 2>&1 | tee "$RUNNER_TEMP/godot-runtime.log"
          if grep -Eq 'SCRIPT ERROR:|Parse Error:|ERROR: Failed to load script|ERROR: Error loading' "$RUNNER_TEMP/godot-runtime.log"; then
            echo "The game failed its startup smoke test."
            exit 1
          fi
          echo "Main scene started successfully for 12 frames."

      - name: Export Android APK
        shell: bash
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: ${{ github.workspace }}/.android/debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: |
          set -euo pipefail
          mkdir -p godot/build
          godot --headless --path godot --export-debug "Android" build/NeonSurvivor.apk --verbose 2>&1 | tee "$RUNNER_TEMP/godot-export.log"
          if grep -Eq 'SCRIPT ERROR:|Parse Error:|ERROR: Failed to load script|ERROR: Error importing' "$RUNNER_TEMP/godot-export.log"; then
            echo "Godot export logged script or resource errors; refusing to publish this APK."
            exit 1
          fi
          APK="godot/build/NeonSurvivor.apk"
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose "$APK"
          ls -lh "$APK"

      - name: Upload validated APK
        uses: actions/upload-artifact@v4
        with:
          name: Parvaz-Android-APK
          path: godot/build/NeonSurvivor.apk
          if-no-files-found: error
