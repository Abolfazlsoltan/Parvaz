name: Build Android App Bundle
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['*.py','buildozer.spec','.github/workflows/**']
jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev
          python -m pip install --upgrade pip setuptools wheel
          pip install buildozer cython==0.29.36
      - name: Build release AAB
        run: buildozer android release
      - uses: actions/upload-artifact@v4
        with:
          name: neon-survivor-android-release
          path: bin/*.aab
          if-no-files-found: error
